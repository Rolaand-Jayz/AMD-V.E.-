name: release-native-packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  stage-arch-release-root:
    name: stage-arch-release-root
    runs-on:
      - self-hosted
      - linux
      - x64
      - arch
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release version
        id: version
        run: |
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" && -n "${GITHUB_REF_NAME:-}" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            short="$(git rev-parse --short HEAD 2>/dev/null || true)"
            if [[ -z "$short" ]]; then
              short="${AVE_VERSION_FALLBACK_SHA:-nogit}"
            fi
            version="0.1.0-beta.1.git$(date -u +%Y%m%d).${short}"
            echo "value=${version}" >> "$GITHUB_OUTPUT"
            echo "tag=v${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Build and stage canonical Arch release root
        run: ./tools/stage_release_root.sh
      - name: Archive staged release root
        run: |
          mkdir -p dist
          tar -C dist -czf dist/stage-root.tar.gz stage-root
      - name: Build compiler-portable beta bundle
        run: |
          ARCHIVE_MODE=archive BUILD_DIR="${GITHUB_WORKSPACE}/build_portable_beta" ./tools/package_release.sh compiler-portable
      - name: Build Arch AUR handoff assets
        run: |
          python3 ./tools/build_native_packages.py \
            --staged-root ./dist/stage-root \
            --output-dir ./dist/aur-handoff \
            --targets archlinux-aur \
            --version "${{ steps.version.outputs.value }}" \
            --release-tag "${{ steps.version.outputs.tag }}"
      - uses: actions/upload-artifact@v4
        with:
          name: stage-root
          path: dist/stage-root.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: portable-bundle
          path: build_portable_beta/dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: aur-handoff
          path: dist/aur-handoff/*

  native-packages:
    name: native-packages-${{ matrix.target }}
    needs: stage-arch-release-root
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: archlinux
            image: archlinux:latest
            install: pacman -Syu --noconfirm base-devel python zstd
          - target: ubuntu-24.04
            image: ubuntu:24.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 dpkg-dev
          - target: ubuntu-22.04
            image: ubuntu:22.04
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 dpkg-dev
          - target: debian-12
            image: debian:12
            install: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y python3 dpkg-dev
          - target: fedora-41
            image: fedora:41
            install: dnf install -y python3 rpm-build tar gzip
          - target: opensuse-leap-15.6
            image: opensuse/leap:15.6
            install: zypper --non-interactive install python3 rpm-build tar gzip
          - target: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest
            install: zypper --non-interactive install python3 rpm-build tar gzip
          - target: rocky-9
            image: rockylinux:9
            install: dnf install -y python3 rpm-build tar gzip
          - target: almalinux-9
            image: almalinux:9
            install: dnf install -y python3 rpm-build tar gzip
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: stage-root
          path: dist
      - name: Install native packaging tools
        run: ${{ matrix.install }}
      - name: Unpack staged release root
        run: |
          mkdir -p dist
          tar -C dist -xzf dist/stage-root.tar.gz
      - name: Build native package
        run: |
          python3 ./tools/build_native_packages.py \
            --staged-root ./dist/stage-root \
            --output-dir ./dist/native-packages \
            --targets "${{ matrix.target }}" \
            --version "${{ needs.stage-arch-release-root.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: native-package-${{ matrix.target }}
          path: dist/native-packages/*

  github-release:
    name: github-release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native-packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/release-assets
          pattern: native-package-*
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: portable-bundle
          path: dist/release-assets
      - uses: actions/download-artifact@v4
        with:
          name: aur-handoff
          path: dist/release-assets
      - name: Generate release checksums
        run: |
          cd dist/release-assets
          find . -maxdepth 1 -type f \
            ! -name 'SHA256SUMS' \
            ! -name '*.sha256' \
            -printf '%f\n' \
            | sort \
            | xargs sha256sum > SHA256SUMS
      - name: Publish beta prerelease
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          generate_release_notes: true
          files: dist/release-assets/*
